[project]
name = "ukumari"
version = "0.1.0"
description = "Spreadsheets defined as text: a calculation graph, evaluated and emitted."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ukumari"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --import-mode=importlib"
doctest_optionflags = "ELLIPSIS"
testpaths = ["src/ukumari", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty==0.0.84",
]
